name: Testes
run-name: ${{ github.actor }} fez commit no projeto
on: [push, pull_request]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurando o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: aula4/requirements.txt

      - name: Instalando as dependencias
        run: pip install -r aula4/requirements.txt

      # Os testes de endpoint sobem a aplicacao com TestClient e usam um
      # banco SQLite em memoria (CINEMA_DB_URL definido em tests/base.py),
      # entao nao precisam de servico externo nem de cinema.db no runner.
      - name: Rodando os testes da API (aula4)
        working-directory: aula4
        run: python -m unittest discover -s tests -t . -v
